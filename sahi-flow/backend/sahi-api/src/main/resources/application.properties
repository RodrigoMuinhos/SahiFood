spring.application.name=sahi-api
server.port=${PORT:8080}

# Database H2 (Local Development)
spring.datasource.url=jdbc:h2:mem:sahidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Jackson JSON
spring.jackson.time-zone=America/Fortaleza
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}

# Security
app.jwt.secret=${JWT_SECRET:dev-secret-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.root=INFO
logging.level.br.com.sahi.flow=DEBUG
logging.level.org.springframework.web=DEBUG
